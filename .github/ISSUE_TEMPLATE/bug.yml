name: Bug report
description: Something is broken or incorrect in @supportly/sdk
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include a minimal reproduction if possible.
        Do not include API keys or webhook secrets.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm install @supportly/sdk@…
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "@supportly/sdk version"
      placeholder: 1.2.1
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: Node 22 / Bun 1 / Cloudflare Workers
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

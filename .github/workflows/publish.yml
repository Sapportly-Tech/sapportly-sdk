name: Publish

# Публикует @supportly/sdk на npm по semver-тегу.
# Формат тега: v1.2.3 — обязан совпадать с typescript/package.json.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only, do not publish to npm"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install
        working-directory: typescript
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: typescript
        run: pnpm typecheck

      - name: Test
        working-directory: typescript
        run: pnpm test

      - name: Build
        working-directory: typescript
        run: pnpm build

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./typescript/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Pack
        working-directory: typescript
        run: pnpm pack --pack-destination "$GITHUB_WORKSPACE"

      - uses: actions/upload-artifact@v4
        with:
          name: supportly-sdk-tarball
          path: "*.tgz"

      - name: Require NPM_TOKEN
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Repo secret NPM_TOKEN is empty. Add an npm Automation token at Settings → Secrets → Actions."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        working-directory: typescript
        run: |
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' 'always-auth=true' > .npmrc
          npm publish --access public --provenance
          rm -f .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.tgz"

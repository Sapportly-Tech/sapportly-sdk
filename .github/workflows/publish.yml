name: Publish

# Публикует @sapportly/sdk (Sapportly TypeScript SDK, npm org sapportly — не supportly)
# по semver-тегу через npm Trusted Publishing (OIDC).
# Тег: v1.2.3 — обязан совпадать с typescript/package.json.
# npmjs.com → пакет → Trusted Publisher:
#   GitHub org/user: Supportly-Tech
#   Repository: supportly-sdk
#   Workflow filename: publish.yml
# npm org: sapportly (пакет @sapportly/sdk; scope supportly для этого SDK недоступен)
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only, do not publish to npm"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      # Node 24 ships npm 11.5+, required for OIDC trusted publishing.
      # Do not set registry-url: setup-node would write always-auth .npmrc
      # with NODE_AUTH_TOKEN and npm would skip OIDC (403 if the token has 2FA).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install
        working-directory: typescript
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: typescript
        run: pnpm typecheck

      - name: Test
        working-directory: typescript
        run: pnpm test

      - name: Build
        working-directory: typescript
        run: pnpm build

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./typescript/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Pack
        working-directory: typescript
        run: pnpm pack --pack-destination "$GITHUB_WORKSPACE"

      - uses: actions/upload-artifact@v4
        with:
          name: supportly-sdk-tarball
          path: "*.tgz"

      - name: Publish to npm
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        working-directory: typescript
        run: npm publish --access public

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.tgz"

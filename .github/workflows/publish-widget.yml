name: Publish widget

# Публикует @sapportly/widget-sdk (Sapportly Widget SDK, npm org sapportly)
# по тегу widget-vX.Y.Z через npm Trusted Publishing (OIDC).
# Тег: widget-v1.2.0 — обязан совпадать с widget/package.json.
# Не путать с publish.yml (теги vX.Y.Z → @sapportly/sdk).
# npmjs.com → пакет → Trusted Publisher:
#   GitHub org/user: Sapportly-Tech
#   Repository: sapportly-sdk
#   Workflow filename: publish-widget.yml
on:
  push:
    tags:
      - "widget-v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only, do not publish to npm"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: widget/pnpm-lock.yaml

      - name: Install
        working-directory: widget
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: widget
        run: pnpm typecheck

      - name: Test
        working-directory: widget
        run: pnpm test

      - name: Build
        working-directory: widget
        run: pnpm build

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/widget-v')
        run: |
          TAG="${GITHUB_REF_NAME#widget-v}"
          PKG="$(node -p "require('./widget/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag widget-v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Pack
        working-directory: widget
        run: pnpm pack --pack-destination "$GITHUB_WORKSPACE"

      - uses: actions/upload-artifact@v4
        with:
          name: sapportly-widget-sdk-tarball
          path: "*.tgz"

      - name: Publish to npm
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        working-directory: widget
        run: npm publish --access public

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/widget-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.tgz"
